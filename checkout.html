<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr. Тай | Оформление заказа</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar checkout-head">
      <div class="brand">
        <div class="brand-logo">Mr. Тай</div>
        <div class="brand-subtitle">оформление доставки</div>
      </div>
      <a class="back-link" href="index.html">&lt; Вернуться в меню</a>
    </header>

    <main class="checkout-main">
      <section class="order-section order-section--page">
        <div class="section-header">
          <h1>Оформление заказа</h1>
        </div>

        <form id="checkout-form" class="checkout-form" autocomplete="off">
          <label>
            Имя
            <input type="text" name="name" placeholder="Ваше имя" required>
          </label>
          <label>
            Телефон
            <input type="tel" name="phone" placeholder="+7 (___) ___-__-__" required>
          </label>
          <label class="checkout-form__wide">
            Адрес доставки
            <input id="address-input" type="text" name="address" placeholder="г. Симферополь, ул. ..." required>
          </label>
          <label class="checkout-form__wide">
            Комментарий к заказу
            <textarea name="comment" rows="3" placeholder="Например: домофон 12, не звонить в дверь"></textarea>
          </label>

          <div class="checkout-block checkout-form__wide">
            <p class="field-label">Состав заказа</p>
            <div class="order-summary" id="order-summary"></div>
          </div>

          <div class="checkout-form__footer checkout-form__wide">
            <p>Итого: <strong id="order-total-field">0 &#8381;</strong></p>
            <button type="submit" class="checkout-submit" id="submit-order">Заказать</button>
          </div>
          <p class="checkout-note checkout-form__wide" id="checkout-note"></p>
        </form>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="success-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="success-title">
      <h2 id="success-title">Заказ принят</h2>
      <p class="modal-text" id="success-text"></p>
      <p class="modal-text">Переходим на главную через <b id="success-countdown">5</b> сек.</p>
      <div class="modal-actions">
        <button type="button" class="checkout-submit" id="success-go">Перейти сейчас</button>
      </div>
    </div>
  </div>

  <script src="checkout.js"></script>
</body>
</html>
